spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3312/pet_care_note
    username: petcare
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
